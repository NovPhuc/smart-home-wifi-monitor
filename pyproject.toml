[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-home-wifi-monitor"
version = "2.0.0"
description = "Room-level WiFi fingerprinting and movement anomaly detection for smart-home elderly monitoring"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
