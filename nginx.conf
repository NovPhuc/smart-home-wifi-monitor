# =============================================================================
# nginx.conf — reverse proxy + TLS cho An Tâm Home (production)
# -----------------------------------------------------------------------------
# Bốn lỗi của bản trước đã được sửa ở đây; mỗi lỗi đều làm nginx KHÔNG KHỞI ĐỘNG
# được (container crash-loop), không phải chỉ là cảnh báo:
#
#  1. `upstream app_backend` khai báo HAI lần (đầu file và cuối file).
#     nginx báo `[emerg] duplicate upstream "app_backend"` và thoát.
#  2. `include proxy_params;` nằm trong 7 location. File đó KHÔNG có trong
#     image `nginx:alpine` (nó thuộc gói Debian nginx-common) nên nginx báo
#     `[emerg] open() "/etc/nginx/proxy_params" failed`. Các header proxy đã
#     được đặt ở cấp `server` và mọi location đều thừa hưởng, nên bỏ hẳn.
#  3. `${DOMAIN:-an-tam.example.com}` là cú pháp của shell, nginx KHÔNG hiểu.
#     File này được mount thẳng vào /etc/nginx/nginx.conf (không qua envsubst
#     template của image), nên phải ghi tên miền thật.
#  4. nginx đọc chứng chỉ ở /etc/letsencrypt/live/... nhưng docker-compose chỉ
#     mount thư mục cert vào /etc/nginx/certs ⇒ không tìm thấy chứng chỉ.
#
# THAY TRƯỚC KHI CHẠY: đổi mọi `an-tam.example.com` dưới đây thành domain thật,
# rồi sửa đúng tên đó trong `.env.prod` (DOMAIN=...). Kiểm tra bằng:
#     docker compose -f docker-compose.prod.yml run --rm nginx nginx -t
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;

    # Ứng dụng giới hạn body 1 MB (Flask MAX_CONTENT_LENGTH); nginx chặn sớm hơn
    # một chút để không phải đọc body rồi mới từ chối.
    client_max_body_size 1M;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        image/svg+xml;

    # --- Giới hạn tần suất ở tầng biên -------------------------------------
    # Chỉ là lớp chặn thô trước khi vào app. Nguồn sự thật vẫn là
    # server/security_middleware.py (theo nhóm endpoint + AttemptLimiter theo
    # email), vì tầng đó biết ngữ cảnh mà nginx không có.
    limit_req_zone $binary_remote_addr zone=api:10m      rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m     rate=5r/m;
    limit_req_zone $binary_remote_addr zone=scan:10m     rate=10r/s;
    limit_req_zone $binary_remote_addr zone=collect:10m  rate=5r/s;
    limit_req_zone $binary_remote_addr zone=sensor:10m   rate=20r/s;

    # --- Backend (KHAI BÁO ĐÚNG MỘT LẦN) -----------------------------------
    upstream app_backend {
        least_conn;
        server app:5000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # --- IP thật khi đi qua Cloudflare -------------------------------------
    # Chỉ có ý nghĩa khi lưu lượng THẬT SỰ đi qua Cloudflare. Nếu chạy trực
    # tiếp, các dải này vô hại (không ai khác dùng chúng), nhưng đừng tự nhận
    # header CF-Connecting-IP từ client lạ.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/20;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # =========================================================================
    # HTTP :80 — chỉ để redirect sang HTTPS và trả thử thách ACME
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name an-tam.example.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # HTTPS :443
    # =========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name an-tam.example.com;

        # Đường dẫn này phải khớp với nơi docker-compose mount thư mục chứng chỉ.
        ssl_certificate     /etc/letsencrypt/live/an-tam.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/an-tam.example.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 1.0.0.1 valid=300s;
        resolver_timeout 5s;

        server_tokens off;

        # Header bảo mật. App (security_middleware) cũng đặt các header này;
        # `add_header` của nginx chỉ áp cho response do chính nó sinh ra hoặc khi
        # response của upstream không có header cùng tên, nên không xung đột.
        # CSP đặt ở đây rộng hơn của app (thêm https:/wss: cho Cloudflare).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(self), gyroscope=(self), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

        # Header proxy đặt ở cấp server — MỌI location dưới đây thừa hưởng,
        # nên không cần (và không được) include proxy_params.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;

        # Health check: không giới hạn, không ghi log
        location = /api/health {
            proxy_pass http://app_backend;
            access_log off;
        }

        # Server-Sent Events: KHÔNG giới hạn tần suất, giữ kết nối lâu.
        # Đặt trước các location /api/ khác để khớp chính xác trước.
        location = /api/stream {
            proxy_pass http://app_backend;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            gzip off;
            access_log off;
        }

        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://app_backend;
        }

        location = /api/scan {
            limit_req zone=scan burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://app_backend;
        }

        location = /api/collect {
            limit_req zone=collect burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://app_backend;
        }

        location /api/sensor {
            limit_req zone=sensor burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://app_backend;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;
            proxy_pass http://app_backend;
        }

        location /static/ {
            proxy_pass http://app_backend;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            access_log off;
        }

        # Service worker KHÔNG được cache dài: bản mới phải tới được máy khách.
        location = /service-worker.js {
            proxy_pass http://app_backend;
            expires 0;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Service-Worker-Allowed "/";
        }

        location = /manifest.webmanifest {
            proxy_pass http://app_backend;
            add_header Content-Type "application/manifest+json";
            add_header Cache-Control "public, max-age=31536000";
        }

        location / {
            proxy_pass http://app_backend;
        }

        # Không có error_page trỏ về /error.html: app đã trả JSON cho mọi lỗi
        # API (security_middleware.install_json_errors) và trang HTML cho phần
        # còn lại; proxy thêm một trang lỗi nữa chỉ làm mất nội dung đó.
    }
}
