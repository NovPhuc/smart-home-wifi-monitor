# Không ghim đường dẫn JDK vào file này nữa: bản cũ trỏ tới
#   C:/Program Files/Android/Android Studio/jbr
# là nơi không còn tồn tại trên máy này (Android Studio đã chuyển sang E:\Android),
# nên mọi lệnh gradlew đều chết với "Java home supplied is invalid".
# Gradle sẽ dùng JAVA_HOME của máy; muốn ghim thì đặt biến môi trường, đừng sửa file
# được commit chung.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
